<svg xmlns="http://www.w3.org/2000/svg" width="940" height="650" viewBox="0 0 940 650" font-family="Helvetica, Arial, sans-serif">
  <rect width="940" height="650" fill="#ffffff"/>
  <text x="40" y="42" font-size="19" font-weight="700" fill="#1f3a5f">Modelo de gobernanza de la seguridad en las universidades (CCN-STIC 881)</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a7d99"/>
    </marker>
  </defs>

  <!-- Organización de la seguridad -->
  <text x="40" y="78" font-size="13" font-weight="700" fill="#2e5f8a">Organización de la seguridad</text>

  <!-- Conectores -->
  <g stroke="#5a7d99" stroke-width="1.8" fill="none">
    <line x1="260" y1="241" x2="300" y2="241"/>
    <line x1="300" y1="142" x2="300" y2="343"/>
    <line x1="300" y1="142" x2="340" y2="142"/>
    <line x1="300" y1="241" x2="340" y2="241"/>
    <line x1="300" y1="343" x2="340" y2="343"/>

    <line x1="580" y1="142" x2="620" y2="142"/>
    <line x1="620" y1="113" x2="620" y2="173"/>
    <line x1="620" y1="113" x2="660" y2="113"/>
    <line x1="620" y1="143" x2="660" y2="143"/>
    <line x1="620" y1="173" x2="660" y2="173"/>

    <line x1="580" y1="241" x2="620" y2="241"/>
    <line x1="620" y1="225" x2="620" y2="257"/>
    <line x1="620" y1="225" x2="660" y2="225"/>
    <line x1="620" y1="257" x2="660" y2="257"/>

    <line x1="580" y1="343" x2="620" y2="343"/>
    <line x1="620" y1="313" x2="620" y2="373"/>
    <line x1="620" y1="313" x2="660" y2="313"/>
    <line x1="620" y1="343" x2="660" y2="343"/>
    <line x1="620" y1="373" x2="660" y2="373"/>
  </g>

  <!-- Comité -->
  <rect x="40" y="163" width="220" height="156" rx="10" fill="#dbe7f3" stroke="#5b87b0" stroke-width="1.8"/>
  <g text-anchor="middle">
    <text x="150" y="189" font-size="12.5" font-weight="700" fill="#1f3a5f">Comité de Seguridad TIC</text>
    <text x="150" y="210" font-size="11" fill="#4a5b68">Articula la gobernanza</text>
    <text x="150" y="227" font-size="11" fill="#4a5b68">Preside el Rector o delegado</text>
    <text x="150" y="244" font-size="11" fill="#4a5b68">Acuerdos por consenso de los</text>
    <text x="150" y="259" font-size="11" fill="#4a5b68">miembros permanentes</text>
    <text x="150" y="284" font-size="10.5" font-weight="700" fill="#8a6a1c">Trimestral durante el proyecto;</text>
    <text x="150" y="299" font-size="10.5" font-weight="700" fill="#8a6a1c">semestral tras la certificación</text>
  </g>

  <!-- Oficina -->
  <rect x="340" y="96" width="240" height="92" rx="10" fill="#dbe7f3" stroke="#5b87b0" stroke-width="1.6"/>
  <g text-anchor="middle">
    <text x="460" y="120" font-size="12" font-weight="700" fill="#1f3a5f">Oficina de Seguridad TIC</text>
    <text x="460" y="139" font-size="11" fill="#4a5b68">Gestiona la seguridad</text>
    <text x="460" y="155" font-size="11" fill="#4a5b68">Dirige el RSEG o su delegado</text>
    <text x="460" y="175" font-size="10.5" font-weight="700" fill="#8a6a1c">Reunión al menos mensual</text>
  </g>

  <!-- OAT (opcional) -->
  <rect x="340" y="206" width="240" height="70" rx="10" fill="#dbe7f3" stroke="#5b87b0" stroke-width="1.6" stroke-dasharray="6 4"/>
  <g text-anchor="middle">
    <text x="460" y="229" font-size="11.5" font-weight="700" fill="#1f3a5f">Órgano de Auditoría Técnica (OAT)</text>
    <text x="460" y="247" font-size="11" fill="#4a5b68">Opcional, según el tamaño</text>
    <text x="460" y="263" font-size="11" fill="#4a5b68">Imparcial respecto de quien implanta</text>
  </g>

  <!-- COCS -->
  <rect x="340" y="294" width="240" height="98" rx="10" fill="#faeed7" stroke="#c9a24b" stroke-width="1.6"/>
  <g text-anchor="middle">
    <text x="460" y="317" font-size="12" font-weight="700" fill="#1f3a5f">Centro de Operaciones de</text>
    <text x="460" y="332" font-size="12" font-weight="700" fill="#1f3a5f">Ciberseguridad (COCS)</text>
    <text x="460" y="351" font-size="11" fill="#4a5b68">Único; interno o externalizado</text>
    <text x="460" y="367" font-size="11" fill="#4a5b68">Colabora con el Área o Servicio</text>
    <text x="460" y="382" font-size="11" fill="#4a5b68">de TI (RSIS)</text>
  </g>

  <!-- Procesos -->
  <g stroke="#5b87b0" stroke-width="1.2" fill="#eef4fa">
    <rect x="660" y="100" width="240" height="26" rx="6"/>
    <rect x="660" y="130" width="240" height="26" rx="6"/>
    <rect x="660" y="160" width="240" height="26" rx="6"/>
    <rect x="660" y="212" width="240" height="26" rx="6"/>
    <rect x="660" y="244" width="240" height="26" rx="6"/>
  </g>
  <g stroke="#c9a24b" stroke-width="1.2" fill="#fdf6e8">
    <rect x="660" y="300" width="240" height="26" rx="6"/>
    <rect x="660" y="330" width="240" height="26" rx="6"/>
    <rect x="660" y="360" width="240" height="26" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#1f3a5f">
    <text x="780" y="117">Adecuación y normativa</text>
    <text x="780" y="147">Gestión de riesgos</text>
    <text x="780" y="177">Análisis y mejora continua</text>
    <text x="780" y="229">Revisiones de seguridad</text>
    <text x="780" y="261">Auditorías de conformidad</text>
    <text x="780" y="317">Detección y respuesta a incidentes</text>
    <text x="780" y="347">Monitorización y vigilancia</text>
    <text x="780" y="377">Servicios de ciberseguridad</text>
  </g>

  <!-- Leyenda -->
  <rect x="340" y="412" width="14" height="14" rx="3" fill="#dbe7f3" stroke="#5b87b0" stroke-width="1.2"/>
  <text x="362" y="423" font-size="11" fill="#4a5b68">Prevención proactiva (Oficina y OAT)</text>
  <rect x="610" y="412" width="14" height="14" rx="3" fill="#faeed7" stroke="#c9a24b" stroke-width="1.2"/>
  <text x="632" y="423" font-size="11" fill="#4a5b68">Vigilancia, detección y respuesta (COCS)</text>

  <!-- Flujo de autorizaciones -->
  <text x="40" y="468" font-size="13" font-weight="700" fill="#2e5f8a">Flujo de autorizaciones</text>

  <g stroke="#5b87b0" stroke-width="1.6" fill="#dbe7f3">
    <rect x="40" y="484" width="190" height="96" rx="10"/>
    <rect x="260" y="484" width="190" height="96" rx="10"/>
    <rect x="480" y="484" width="190" height="96" rx="10"/>
    <rect x="700" y="484" width="190" height="96" rx="10"/>
  </g>
  <g stroke="#5a7d99" stroke-width="2.2" fill="none" marker-end="url(#arr)">
    <line x1="233" y1="532" x2="256" y2="532"/>
    <line x1="453" y1="532" x2="476" y2="532"/>
    <line x1="673" y1="532" x2="696" y2="532"/>
  </g>
  <g text-anchor="middle">
    <text x="135" y="508" font-size="11.5" font-weight="700" fill="#1f3a5f">1. Foro de Seguridad TIC</text>
    <text x="135" y="529" font-size="10.5" fill="#4a5b68">Se debate una nueva necesidad</text>
    <text x="135" y="544" font-size="10.5" fill="#4a5b68">de seguridad de las</text>
    <text x="135" y="559" font-size="10.5" fill="#4a5b68">universidades</text>

    <text x="355" y="508" font-size="11.5" font-weight="700" fill="#1f3a5f">2. Oficina y COCS</text>
    <text x="355" y="529" font-size="10.5" fill="#4a5b68">Se estudia la viabilidad</text>
    <text x="355" y="544" font-size="10.5" fill="#4a5b68">técnica y se formaliza</text>
    <text x="355" y="559" font-size="10.5" fill="#4a5b68">la propuesta</text>

    <text x="575" y="508" font-size="11.5" font-weight="700" fill="#1f3a5f">3. Comité de Seguridad TIC</text>
    <text x="575" y="529" font-size="10.5" fill="#4a5b68">Se aprueba la propuesta</text>
    <text x="575" y="544" font-size="10.5" fill="#4a5b68">y se marcan directrices</text>
    <text x="575" y="559" font-size="10.5" fill="#4a5b68">para su implantación</text>

    <text x="795" y="508" font-size="11.5" font-weight="700" fill="#1f3a5f">4. Oficina y COCS</text>
    <text x="795" y="529" font-size="10.5" fill="#4a5b68">Se implementa la medida;</text>
    <text x="795" y="544" font-size="10.5" fill="#4a5b68">se gestiona y se mantiene</text>
  </g>

  <text x="40" y="604" font-size="10.5" fill="#4a5b68">Foro de Seguridad TIC: Grupo de Trabajo de Seguridad y Auditoría TI de la sectorial TIC de Crue (hoy Crue Digitalización).</text>

  <text x="900" y="634" font-size="12" fill="#8a949e" text-anchor="end">Elaboración propia a partir de las figuras 3 y 6 de la guía CCN-STIC 881.</text>
</svg>
